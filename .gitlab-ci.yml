# GitLab CI/CD Pipeline Configuration

stages:
  - lint
  - build
  - deploy

default:
  image: node:20-alpine
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - .npm/

before_script:
  - npm ci --cache .npm --prefer-offline

lint:
  stage: lint
  script:
    - npm run lint
  only:
    - main
    - merge_requests

build:
  stage: build
  script:
    - npm run build
  artifacts:
    name: "build-$CI_COMMIT_REF_SLUG"
    paths:
      - dist/
    expire_in: 1 week
  only:
    - main
    - merge_requests

pages:
  stage: deploy
  dependencies:
    - build
  before_script: []
  script:
    - mv dist public
  artifacts:
    paths:
      - public
  only:
    - main
