name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: 🔍 Lint & Quality Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  vault-secrets-example:
    name: 🔐 HashiCorp Vault Secrets Fetching (Example)
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: false # Enable when connected to a live HashiCorp Vault server
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # HashiCorp Vault Action for fetching dynamic secrets via OIDC/JWT
      - name: Import Secrets from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.example.hzd.de:8200
          role: ci-pipeline-role
          method: jwt
          secrets: |
            secret/data/ci/personal-website DEPLOY_TOKEN | DEPLOY_TOKEN;
            secret/data/ci/personal-website API_KEY | VITE_API_KEY;

  build-and-deploy:
    name: 🚀 Build & Deploy
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Assets
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-production
          path: dist/
